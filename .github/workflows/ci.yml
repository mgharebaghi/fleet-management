name: CI

# `quality` needs no SQL Server: TypeScript, lint, unit tests and a
# production build, on GitHub-hosted ubuntu-latest.
#
# `integration` and `e2e` need a reachable, isolated remote SQL Server
# test database, so they run on the self-hosted Linux runner.
# Heavy jobs run when selected for an internal PR, or on demand from the
# default branch. Pushes to main never start the self-hosted jobs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.plan.outputs.integration }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The selector compares the PR base and head from their merge base.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Test the CI selector
        run: node --test scripts/select-test-plan.test.mjs

      - name: Select test suites
        id: plan
        run: node scripts/select-test-plan.mjs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Install dependencies
        run: npm ci

      # The Prisma Client is generated from the already-approved schema.prisma
      # (no migration, db push or db pull) and is required for the app to
      # type-check and build. DATABASE_URL only needs a valid connection
      # string shape here; generate never connects to a database.
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=ci;schema=dbo;user=ci;password=ci;encrypt=true;trustServerCertificate=true;"

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate Prisma contract
        run: npm run prisma:validate
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=ci;schema=dbo;user=ci;password=ci;encrypt=true;trustServerCertificate=true;"

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # next build evaluates src/infrastructure/database/prisma/prisma-client.ts
      # at module load time, which validates these runtime DATABASE_*
      # variables (see mssql-config.ts). No SQL Server connection is made by
      # this validation; the values only need to satisfy the required-field
      # and type checks.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=ci;schema=dbo;user=ci;password=ci;encrypt=true;trustServerCertificate=true;"
          DATABASE_SERVER: "localhost"
          DATABASE_PORT: "1433"
          DATABASE_NAME: "ci"
          DATABASE_USER: "ci"
          DATABASE_PASSWORD: "ci"
          DATABASE_ENCRYPT: "true"
          DATABASE_TRUST_SERVER_CERTIFICATE: "true"

  # Runs Prisma repository tests against the isolated
  # FleetManagementDB_IntegrationTest database on the self-hosted runner.
  # Preserve the internal-PR restriction for the runner and its secrets.
  integration:
    needs: quality
    concurrency:
      group: ${{ github.repository }}-integration-database
      cancel-in-progress: false
    if: >-
      needs.quality.outputs.integration != 'skip' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # Generate only needs a well-formed connection string and does not
      # connect to SQL Server.
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=ci;schema=dbo;user=ci;password=ci;encrypt=true;trustServerCertificate=true;"

      # Each *.integration.test.ts file loads TEST_DATABASE_* itself and
      # refuses to run against anything but FleetManagementDB_IntegrationTest.
      - name: Integration tests
        run: |
          if [[ "$TEST_SCOPE" == "inventory-maintenance" ]]; then
            # Include vehicle dispatch consumers of maintenance work-order state.
            files="$(git ls-files -- \
              ':(glob)src/features/inventory/**/*.integration.test.ts' \
              ':(glob)src/features/maintenance/**/*.integration.test.ts' \
              ':(glob)src/features/trip/**/*.integration.test.ts' \
              ':(glob)src/features/drivers/**/*.integration.test.ts' \
              ':(glob)src/features/fleet/infrastructure/meter-readings/**/*.integration.test.ts')"
            if [[ -z "$files" ]]; then
              echo "::error::No integration test files matched the selected scope."
              exit 1
            fi
            mapfile -t tests <<< "$files"
            npx --no-install vitest run --no-file-parallelism --testTimeout=45000 \
              src/test-support/database/maintenance-inventory-contract.integration.test.ts "${tests[@]}"
          else
            npm run test:integration
          fi
        env:
          TEST_SCOPE: ${{ needs.quality.outputs.integration }}
          MAINTENANCE_CONTRACT_DB: TEST_DATABASE
          TEST_DATABASE_SERVER: ${{ secrets.TEST_DATABASE_SERVER }}
          TEST_DATABASE_PORT: ${{ secrets.TEST_DATABASE_PORT }}
          TEST_DATABASE_NAME: ${{ secrets.TEST_DATABASE_NAME }}
          TEST_DATABASE_USER: ${{ secrets.TEST_DATABASE_USER }}
          TEST_DATABASE_PASSWORD: ${{ secrets.TEST_DATABASE_PASSWORD }}
          TEST_DATABASE_ENCRYPT: ${{ secrets.TEST_DATABASE_ENCRYPT }}
          TEST_DATABASE_TRUST_SERVER_CERTIFICATE: ${{ secrets.TEST_DATABASE_TRUST_SERVER_CERTIFICATE }}

  # Runs Playwright against the isolated FleetManagementDB_E2ETest database
  # on the self-hosted runner and never on a push to main.
  e2e:
    needs: quality
    concurrency:
      group: ${{ github.repository }}-e2e-database
      cancel-in-progress: false
    if: >-
      needs.quality.outputs.e2e != 'skip' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=ci;schema=dbo;user=ci;password=ci;encrypt=true;trustServerCertificate=true;"

      # cdn.playwright.dev is unreachable from this runner (403, geo-blocked),
      # so no Playwright-managed browser download here. playwright.config.ts
      # detects CI and drives the runner's pre-installed Google Chrome via
      # Playwright's `channel: "chrome"` instead, which needs no download.
      - name: E2E tests
        run: |
          # Validate only this job's test database before the browser build.
          MAINTENANCE_CONTRACT_DB=E2E_DATABASE npm run test:maintenance-contract
          if [[ "$TEST_SCOPE" == "inventory-maintenance" ]]; then
            npm run test:e2e -- --retries=0 \
              'e2e/(inventory-|maintenance-|service-plans\.|admin-nav-accordion\.|form-feedback\.|list-clear-filters\.|list-filter-consistency\.|page-navigation\.|route-loading\.|vehicle-meter-readings\.|vehicles\.|trips\.|trip-vehicle-capacity\.|drivers\.)'
          else
            npm run test:e2e -- --retries=0
          fi
        env:
          TEST_SCOPE: ${{ needs.quality.outputs.e2e }}
          E2E_DATABASE_SERVER: ${{ secrets.E2E_DATABASE_SERVER }}
          E2E_DATABASE_PORT: ${{ secrets.E2E_DATABASE_PORT }}
          E2E_DATABASE_NAME: ${{ secrets.E2E_DATABASE_NAME }}
          E2E_DATABASE_USER: ${{ secrets.E2E_DATABASE_USER }}
          E2E_DATABASE_PASSWORD: ${{ secrets.E2E_DATABASE_PASSWORD }}
          E2E_DATABASE_ENCRYPT: ${{ secrets.E2E_DATABASE_ENCRYPT }}
          E2E_DATABASE_TRUST_SERVER_CERTIFICATE: ${{ secrets.E2E_DATABASE_TRUST_SERVER_CERTIFICATE }}
